<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Video Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            overflow: hidden;
            position: relative;
        }

        /* Khung chứa video nền động */
        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        /* Lớp phủ tối mờ (Overlay) giúp làm nổi bật khung app lên trên video nền */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45); /* Độ tối của lớp phủ, chỉnh từ 0.3 đến 0.7 tùy ý */
            backdrop-filter: blur(4px); /* Hiệu ứng kính mờ nhẹ trên nền video */
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 10;
        }

        .logo-icon {
            font-size: 42px;
            color: #6a11cb;
            margin-bottom: 10px;
        }

        h2 { color: #1f2937; margin-bottom: 6px; font-size: 24px; font-weight: 700; }
        p.subtitle { color: #4b5563; font-size: 14px; margin-bottom: 20px; font-weight: 500; }
        
        .platforms {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .platform-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.95);
        }
        input:focus { border-color: #6a11cb; box-shadow: 0 0 0 4px rgba(106, 17, 203, 0.15); }
        
        .paste-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px;
        }
        .paste-btn:hover { color: #6a11cb; }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(106, 17, 203, 0.3);
        }
        button.submit-btn:hover { opacity: 0.95; transform: translateY(-1px); }
        button.submit-btn:active { transform: translateY(0); }

        #result { margin-top: 25px; word-break: break-word; text-align: left; }
        .success-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 14px;
            text-align: center;
        }
        .video-title { font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 12px; line-height: 1.4; }
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
        }
        .download-btn:hover { background: #059669; }
        
        .loading { color: #6a11cb; font-weight: 600; font-size: 15px; padding: 15px; text-align: center; }
        .error { color: #ef4444; background: #fef2f2; border: 1px solid #fee2e2; padding: 12px; border-radius: 10px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <!-- Video nền anime động (Bạn có thể thay link video .mp4 khác vào đây nếu muốn) -->
    <video autoplay muted loop class="bg-video">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-lights-31910-large.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

<div class="container">
    <div class="logo-icon"><i class="fa-solid fa-cloud-arrow-down"></i></div>
    <h2>Media Downloader</h2>
    <p class="subtitle">Tải video không dính logo mượt mà</p>

    <div class="platforms">
        <span class="platform-badge" style="background: #e7f3ff; color: #1877f2;"><i class="fa-brands fa-facebook"></i> Facebook</span>
        <span class="platform-badge" style="background: #fee2e2; color: #ef4444;"><i class="fa-brands fa-tiktok"></i> TikTok</span>
        <span class="platform-badge" style="background: #fce7f3; color: #db2777;"><i class="fa-brands fa-instagram"></i> Instagram</span>
        <span class="platform-badge" style="background: #f1f5f9; color: #000000;"><i class="fa-brands fa-x-twitter"></i> X</span>
    </div>

    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="Dán link video vào đây...">
        <button class="paste-btn" onclick="pasteLink()" title="Dán nhanh"><i class="fa-solid fa-paste"></i></button>
    </div>

    <button class="submit-btn" onclick="getLink()">Tải Video Ngay</button>
    <div id="result"></div>
</div>

<script>
    async function pasteLink() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('videoUrl').value = text;
        } catch (err) {
            alert('Hãy dùng Ctrl+V để dán link nhé!');
        }
    }

    async function getLink() {
        const url = document.getElementById('videoUrl').value.trim();
        const resultDiv = document.getElementById('result');

        if (!url) {
            resultDiv.innerHTML = '<p class="error"><i class="fa-solid fa-circle-exclamation"></i> Vui lòng dán đường dẫn video!</p>';
            return;
        }

        resultDiv.innerHTML = '<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang bóc tách dữ liệu video, vui lòng chờ...</div>';

        try {
            const response = await fetch('https://download-fb.onrender.com/get-download-link', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `
                    <div class="success-box">
                        <p class="video-title"><i class="fa-solid fa-film"></i> ${data.title}</p>
                        <a class="download-btn" href="${data.download_url}" target="_blank" download>
                            <i class="fa-solid fa-download"></i> Tải Xuống Ngay
                        </a>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `<p class="error"><i class="fa-solid fa-triangle-exclamation"></i> ${data.message}</p>`;
            }
        } catch (error) {
            resultDiv.innerHTML = '<p class="error"><i class="fa-solid fa-server"></i> Không thể kết nối đến Server trên Render!</p>';
        }
    }
</script>

</body>
</html>
