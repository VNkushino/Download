<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Video Downloader</title>
    <!-- Sử dụng Font chữ hiện đại và thư viện icon FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .logo-icon {
            font-size: 40px;
            color: #667eea;
            margin-bottom: 10px;
        }
        h2 { color: #1f2937; margin-bottom: 8px; font-size: 24px; font-weight: 700; }
        p.subtitle { color: #6b7280; font-size: 14px; margin-bottom: 25px; }
        
        .platforms {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            color: #4b5563;
            font-size: 20px;
        }
        .platforms i { transition: transform 0.2s; }
        .platforms i:hover { transform: scale(1.2); color: #667eea; }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        input:focus { border-color: #667eea; box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15); }
        
        .paste-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px;
        }
        .paste-btn:hover { color: #667eea; }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        button.submit-btn:hover { opacity: 0.95; transform: translateY(-1px); }
        button.submit-btn:active { transform: translateY(0); }

        #result { margin-top: 25px; word-break: break-word; text-align: left; }
        .success-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        .video-title { font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 12px; }
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
        }
        .download-btn:hover { background: #059669; }
        
        .loading { color: #667eea; font-weight: 500; font-size: 15px; padding: 15px; }
        .error { color: #ef4444; background: #fef2f2; border: 1px solid #fee2e2; padding: 12px; border-radius: 10px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-icon"><i class="fa-solid.fa-cloud-arrow-down fa-solid fa-download"></i></div>
    <h2>Media Downloader</h2>
    <p class="subtitle">Tải video không dính logo siêu tốc</p>

    <!-- Icon các nền tảng hỗ trợ -->
    <div class="platforms">
        <i class="fa-brands fa-facebook" title="Facebook"></i>
        <i class="fa-brands fa-tiktok" title="TikTok"></i>
        <i class="fa-brands fa-instagram" title="Instagram"></i>
        <i class="fa-brands fa-x-twitter" title="X (Twitter)"></i>
    </div>

    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="Dán link video vào đây...">
        <button class="paste-btn" onclick="pasteLink()" title="Dán nhanh"><i class="fa-solid fa-paste"></i></button>
    </div>

    <button class="submit-btn" onclick="getLink()">Tải Video Ngay</button>
    <div id="result"></div>
</div>

<script>
    // Tính năng dán nhanh từ clipboard
    async function pasteLink() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('videoUrl').value = text;
        } catch (err) {
            alert('Trình duyệt không cho phép đọc bộ nhớ tạm tự động. Hãy dùng Ctrl+V nhé!');
        }
    }

    async function getLink() {
        const url = document.getElementById('videoUrl').value.trim();
        const resultDiv = document.getElementById('result');

        if (!url) {
            resultDiv.innerHTML = '<p class="error"><i class="fa-solid fa-circle-exclamation"></i> Vui lòng dán đường dẫn video!</p>';
            return;
        }

        resultDiv.innerHTML = '<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang bóc tách dữ liệu video, vui lòng chờ...</div>';

        try {
            const response = await fetch('https://download-fb.onrender.com/get-download-link', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `
                    <div class="success-box">
                        <p class="video-title"><i class="fa-solid fa-film"></i> ${data.title}</p>
                        <a class="download-btn" href="${data.download_url}" target="_blank" download>
                            <i class="fa-solid fa-download"></i> Tải Xuống Ngay
                        </a>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `<p class="error"><i class="fa-solid fa-triangle-exclamation"></i> ${data.message}</p>`;
            }
        } catch (error) {
            resultDiv.innerHTML = '<p class="error"><i class="fa-solid fa-server"></i> Không thể kết nối đến Server trên Render!</p>';
        }
    }
</script>

</body>
</html>
